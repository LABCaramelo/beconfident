  "openapi": "3.1.0",
  "info": {
    "title": "Tutor de idiomas — contrato independente proposto",
    "version": "0.1.0",
    "description": "Decisão de projeto de 2026-10-29. Não é documentação de endpoints BeConfident. Núcleo para reconstrução: WhatsApp, tutor, avaliação, currículo, revisão, voz e direitos. JSON é sintaxe válida de YAML 1.2. Login/tokens são delegados a serviço de identidade ainda a escolher. Recursos sociais, certificados, widgets, foto e catálogo licenciado ainda precisam de contratos próprios. Todas as consultas verificam propriedade; IDs alheios retornam 404. Idempotência é por principal e operação com hash do corpo: repetir chave/corpo retorna resposta original, chave com corpo diferente retorna 409. Semântica de retries e validade de chaves devem ser definidas na implementação."
  },
