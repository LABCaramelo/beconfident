  "components": {
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "opaque-or-jwt",
        "description": "Token emitido pelo serviço de identidade; validar emissor/audiência/expiração e dono do recurso."
      },
      "WhatsAppSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Hub-Signature-256",
        "description": "Assinatura verificada no corpo bruto pelo adaptador empresarial; não é autenticação de aluno."
      },
      "BillingSignature": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Provider-Signature",
        "description": "Placeholder de adaptador; implementar esquema oficial de cada emissor antes de produção."
      }
    },
    "parameters": {
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Chave opaca gerada pelo cliente; vinculada ao principal, operação e hash do corpo.",
        "schema": {
          "type": "string",
          "minLength": 8,
          "maxLength": 120
        }
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "maxLength": 1000
        }
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      }
    },
    "responses": {
      "Problem": {
        "description": "Erro estruturado: validation_error 400; unauthenticated 401; entitlement_required 403; not_found 404; version_conflict/idempotency_conflict 409; unsupported_media 415; rate_limited 429; dependency_unavailable 503. Não expor segredos, recibos ou stacktrace.",
