        "description": "Adaptador do provedor valida envelope e extrai IDs de eventos individualmente. Um envelope pode conter vários eventos. Duplicatas retornam sucesso; assinatura inválida retorna 401; indisponibilidade antes do commit retorna 503. Nunca executar o LLM na requisição do webhook.",
